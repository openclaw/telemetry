name: Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - name: Check vocabulary covers the latest OpenClaw release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$(gh api repos/openclaw/openclaw/releases/latest --jq .tag_name)"
          release_sha="$(gh api "repos/openclaw/openclaw/commits/$release_tag" --jq .sha)"
          npm run vocabulary:check -- --release-revision "$release_sha"
      - run: npx wrangler deploy --dry-run

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
