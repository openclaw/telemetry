name: Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

# Hold the production lane through publication and verification. Older queued
# runs must also pass the current-main guard before they can publish or deploy.
concurrency:
  group: telemetry-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    outputs:
      refresh: ${{ steps.plan.outputs.refresh }}
      deploy: ${{ steps.plan.outputs.deploy }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/vocabulary-maintenance.mjs plan --base "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME"

  generate:
    needs: discover
    if: needs.discover.outputs.refresh == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: telemetry
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: ${{ fromJSON(needs.discover.outputs.plan).releases[0].revision }}
          path: upstream-source
          fetch-depth: 0
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - run: npm ci
        working-directory: telemetry
      # This imports released upstream packaging code. No write token or
      # Cloudflare secret is available; the next job checks only its data output.
      - env:
          VOCABULARY_PLAN: ${{ needs.discover.outputs.plan }}
        run: node scripts/vocabulary-maintenance.mjs generate --source ../upstream-source
        working-directory: telemetry
      - uses: actions/upload-artifact@v7
        with:
          name: generated-vocabulary
          if-no-files-found: error
          retention-days: 1
          path: |
            telemetry/data/public-vocabulary.json
            telemetry/src/public-vocabulary.ts

  check:
    needs: [discover, generate]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'pull_request' ||
       (needs.discover.result == 'success' && needs.discover.outputs.deploy == 'true' &&
        (needs.generate.result == 'success' || needs.generate.result == 'skipped')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@v8
        if: needs.discover.outputs.refresh == 'true'
        with:
          name: generated-vocabulary
          path: ${{ runner.temp }}/vocabulary
      - if: needs.discover.outputs.refresh == 'true'
        env:
          VOCABULARY_PLAN: ${{ needs.discover.outputs.plan }}
        run: node scripts/vocabulary-maintenance.mjs apply --artifact "$RUNNER_TEMP/vocabulary"
      - run: npm ci
      - run: npm run check
      - name: Check vocabulary covers the latest OpenClaw release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$(gh api repos/openclaw/openclaw/releases/latest --jq .tag_name)"
          release_sha="$(gh api "repos/openclaw/openclaw/commits/$release_tag" --jq .sha)"
          npm run vocabulary:check -- --release-revision "$release_sha"
      - run: npx wrangler deploy --dry-run
      - uses: actions/upload-artifact@v7
        if: needs.discover.outputs.refresh == 'true'
        with:
          name: checked-vocabulary
          if-no-files-found: error
          retention-days: 1
          path: |
            data/public-vocabulary.json
            src/public-vocabulary.ts

  publish:
    needs: [discover, check]
    if: needs.discover.outputs.refresh == 'true' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@v8
        with:
          name: checked-vocabulary
          path: ${{ runner.temp }}/vocabulary
      # No dependency installation or producer-supplied executable runs here.
      - env:
          VOCABULARY_PLAN: ${{ needs.discover.outputs.plan }}
        run: node scripts/vocabulary-maintenance.mjs apply --artifact "$RUNNER_TEMP/vocabulary"
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/vocabulary-maintenance.mjs guard-main --target "$GITHUB_SHA"
          changed="$(git diff --name-only)"
          test -n "$changed"
          test -z "$(printf '%s\n' "$changed" | grep -Ev '^(data/public-vocabulary.json|src/public-vocabulary.ts)$')"
          git diff --check
          data_blob=$(git hash-object data/public-vocabulary.json)
          source_blob=$(git hash-object src/public-vocabulary.ts)
          pending_head=$(git ls-remote origin refs/heads/automation/public-vocabulary | cut -f1)
          if [[ -n "$pending_head" ]]; then
            merged_head=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head automation/public-vocabulary \
              --state merged --limit 1 --json headRefOid --jq '.[0].headRefOid // empty')
            # A pushed candidate can survive failed PR creation or a closed PR.
            # Only a proven merged head may be replaced with different snapshots.
            if [[ "$pending_head" != "$merged_head" ]]; then
              git fetch --no-tags origin "$pending_head"
              pending_data=$(git rev-parse "$pending_head:data/public-vocabulary.json")
              pending_source=$(git rev-parse "$pending_head:src/public-vocabulary.ts")
              other_paths=$(git diff --name-only "$GITHUB_SHA" "$pending_head" | grep -Ev '^(data/public-vocabulary.json|src/public-vocabulary.ts)$' || true)
              if [[ "$pending_data" != "$data_blob" || "$pending_source" != "$source_blob" || -n "$other_paths" ]]; then
                echo "Unmerged vocabulary branch has a different candidate; recover or merge it before publishing another payload." >&2
                exit 1
              fi
            fi
          fi
          printf 'data_blob=%s\nsource_blob=%s\n' "$data_blob" "$source_blob" >> "$GITHUB_OUTPUT"
      - id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.0.0
        with:
          token: ${{ github.token }}
          branch-token: ${{ github.token }}
          path: .
          base: main
          branch: automation/public-vocabulary
          add-paths: |
            data/public-vocabulary.json
            src/public-vocabulary.ts
          commit-message: 'chore(telemetry): refresh released public vocabulary'
          title: 'chore(telemetry): refresh released public vocabulary'
          body: 'Publishes the released public vocabulary validated by this workflow before deployment.'
          draft: false
      - id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_HEAD: ${{ steps.pr.outputs.pull-request-head-sha }}
          DATA_BLOB: ${{ steps.candidate.outputs.data_blob }}
          SOURCE_BLOB: ${{ steps.candidate.outputs.source_blob }}
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          trap 'echo "Publication incomplete; inspect https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER" >&2' ERR
          # The action must preserve the exact checked artifact, even if its
          # branch preparation observed a newer base. A moved main aborts here.
          test "$(git rev-parse "$PR_HEAD:data/public-vocabulary.json")" = "$DATA_BLOB"
          test "$(git rev-parse "$PR_HEAD:src/public-vocabulary.ts")" = "$SOURCE_BLOB"
          ready=false
          for ((attempt=0; attempt<15; attempt++)); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.head.sha,(.mergeable|tostring)] | @tsv')
            IFS=$'\t' read -r head mergeable <<< "$state"
            test "$head" = "$PR_HEAD"
            if [[ "$mergeable" == true ]]; then ready=true; break; fi
            test "$mergeable" = null
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo "GitHub has not resolved mergeability; retained the candidate for a later run." >&2
            exit 1
          fi
          node scripts/vocabulary-maintenance.mjs guard-main --target "$GITHUB_SHA"
          if ! gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$PR_HEAD"; then
            echo "Merge did not confirm success; checking the PR before continuing." >&2
          fi
          receipt=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.merged,.head.sha,.merge_commit_sha] | @tsv')
          IFS=$'\t' read -r merged head sha <<< "$receipt"
          test "$merged" = true
          test "$head" = "$PR_HEAD"
          test -n "$sha"
          gh auth setup-git
          git fetch --no-tags origin main:refs/remotes/origin/main "$sha"
          git merge-base --is-ancestor "$sha" origin/main
          if [[ "$(git rev-parse "$sha^")" != "$GITHUB_SHA" ]]; then
            echo "Main advanced during merge; a fresh run must validate before deployment." >&2
            exit 1
          fi
          test "$(git rev-parse "$sha:data/public-vocabulary.json")" = "$DATA_BLOB"
          test "$(git rev-parse "$sha:src/public-vocabulary.ts")" = "$SOURCE_BLOB"
          node scripts/vocabulary-maintenance.mjs guard-main --target "$sha"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [discover, check, publish]
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' && needs.discover.outputs.deploy == 'true' &&
      needs.check.result == 'success' &&
      (needs.publish.result == 'success' ||
       (needs.publish.result == 'skipped' && needs.discover.outputs.refresh == 'false'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      TARGET_SHA: ${{ needs.publish.outputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - run: npm ci
      - id: admitted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          node scripts/vocabulary-maintenance.mjs guard-main --target "$TARGET_SHA"
          gh api "repos/openclaw/telemetry/statuses/$TARGET_SHA" --method POST \
            -f state=pending -f context=telemetry/deploy \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
      - id: deployed
        run: |
          npx wrangler deploy --tag "$TARGET_SHA"
          node scripts/vocabulary-maintenance.mjs verify-deployment --target "$TARGET_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # GITHUB_TOKEN's data commit does not trigger another push run. This same
      # run deploys it, and a failed/missing receipt makes the next poll retry.
      - if: always() && steps.admitted.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ steps.deployed.outcome == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/openclaw/telemetry/statuses/$TARGET_SHA" --method POST \
            -f state="$DEPLOY_RESULT" -f context=telemetry/deploy \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
